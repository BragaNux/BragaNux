# Gera a animação da cobrinha a partir do gráfico de contribuições e publica no branch "output".
# O README usa os arquivos de https://raw.githubusercontent.com/BragaNux/BragaNux/output/
name: Cobrinha

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cobrinha.yml"]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gera os SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha-light.svg?color_snake=#C88A0A&color_dots=#EBEDF0,#C9D1F7,#93A3EE,#5B71E2,#2A44D2
            dist/cobrinha-dark.svg?palette=github-dark&color_snake=#EFC253&color_dots=#161B22,#1E2754,#34449A,#5A6FE0,#8FA2FF

      - name: Publica no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Atualiza a cobrinha
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
